<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elixir Mobile help</title>
<meta name="theme-color" content="#a7b58c">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  :root { --panel: #a7b58c; --ink: #17200e; --muted: rgba(23, 32, 14, .68); --line: rgba(23, 32, 14, .22); }
  * { box-sizing: border-box; }
  body { margin: 0; background: #1d2216; color: var(--ink); font: 20px/1.3 "VT323", ui-monospace, monospace; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  .lcd { background: var(--panel); border-radius: 10px; padding: 18px 18px 8px; box-shadow: inset 0 2px 8px rgba(0, 0, 0, .35); }
  h1 { margin: 0 0 4px; font-size: 2.1rem; letter-spacing: -.02em; }
  h2 { margin: 22px 0 6px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 1.35rem; text-transform: uppercase; }
  p, li { margin: 0 0 8px; }
  ul { padding-left: 20px; margin: 0 0 8px; }
  b { font-weight: 400; text-transform: uppercase; background: var(--ink); color: var(--panel); padding: 0 4px; border-radius: 2px; }
  .lead { color: var(--muted); }
  a { color: var(--ink); }
  .back { display: inline-block; margin: 16px 0 6px; font-size: 1.2rem; }
</style>
</head>
<body>
<main>
<div class="lcd">
  <h1>elixir mobile</h1>
  <p class="lead">A six voice drum machine for your phone, built on the LXR-02 engine. The same help is in the app: press HELP ME! at the top.</p>

  <!--@HELP@-->

  <a class="back" href="./">&larr; back to elixir</a>
</div>
</main>
</body>
</html>
